schema: spec-driven

context: |
  Scope: OpenSpec describes WHAT PMZilla Lab does (observable behavior). The
  WHY stays in docs/pmzilla/application.md. The work queue (the roadmap)
  lives in the issues of the private repository; application.md keeps its
  rationale.
  - openspec/specs/ describes the existing system (baseline).
  - openspec/changes/ describes evolutions (proposal, design, tasks, delta specs).

  Language: all specs, proposals, designs and tasks are written in English.

  Confidentiality (specs are tracked by Git):
  - No team, project or person names (use roles or generic designations).
  - No ticket keys, no personal identifiers.
  - No excerpts from books or watch articles.

  Behavior, not configuration: describe what the system does, never the values
  found in configuration files (thresholds, paths, credentials, parameters).

  Spec conventions (decided when the baseline open questions were resolved):
  - Configuration values (thresholds, merge constants, role names, keychain
    services, models, schedules, accounts, sizes) are never written. The spec
    says "configurable" and describes the effect.
  - Report wording: only the key phrases verified by tests.
  - Test fixtures and vendored libraries are not specified.
  - Data model: the database-* capabilities describe entities and guarantees
    (roles, grants, masking under 5), not columns.
  - Counts frozen in tests are snapshots, not requirements.
  - Behavior read in code but not tested stays a requirement, marked
    "untested". The gap is listed in openspec/test-gaps.md.

rules:
  specs:
    - Write requirements as "The system SHALL ...", each with at least one "#### Scenario:" in WHEN/THEN form.
    - Keep the language free of names, ticket keys, personal identifiers and book excerpts.
    - Describe behavior only; never copy configuration values.
  proposal:
    - State the user-visible change and its motivation briefly; link to docs/pmzilla/application.md for the rationale of the work queue instead of repeating it.
    - "Include a section \"What Mothra will consume\" (Mothra is the planned interface layer over the lab's data): the views, service functions, data contract and structured masked cells that the change exposes. A change with nothing to expose says so in one line."
    - "For a change of a feature labelled product:mothra, follow docs/pmzilla/mothra-tranches.md: skeleton slice 0 first, then vertical slices each usable end to end; each slice states what it delivers, what it adds to the foundation and its estimate. Nothing is created before the author's validation."
  design:
    - "Include the section \"What Mothra will consume\" (views, service functions, data contract, structured masked cells). No business logic lives only in the output formatting of a command: it lives in a view or a service function that the formatting calls, so that Mothra can consume the same result."
  tasks:
    - Keep tasks small and verifiable; each one names the test suite that covers it when one exists.
    - "For a change of a feature labelled product:mothra, follow docs/pmzilla/mothra-tranches.md: only the next two slices are detailed in tasks, the others stay hypotheses; an end-of-slice review comes before detailing the next slice; nothing is created before the author's validation."
