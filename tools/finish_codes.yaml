# Registre des codes de sortie du script de fin (R-148/u17, #583) : tools/finish_train.sh seul, depuis B9 (finish-single-b7-b9, design D8), qui retire les
# fins unitaires tools/finish_branch.sh et tools/finish_worktree.sh avec leurs entrées. Une entrée par couple (script, code). Le test
# tests/finish_codes/test_registre_codes.py le garde :
#   - jamais deux entrées pour le même (script, code) : un code, un sens ;
#   - un code ne sert à deux scripts que s'il est déclaré partagé dans le test ; avec un seul script, le cas ne se présente plus ;
#   - FORME IMPOSÉE aux scripts de fin : tout code rendu passe par « refus <n> "…" » (ou sa forme continuée « refus <n> \ ») ou par « exit <n> »
#     littéral. Toute sortie calculée (« exit "$…" », « exit $… », « refus "$…" », « sortir "$…" ») est refusée par le test tant qu'elle n'est pas
#     listée dans « sorties_dynamiques » (script, motif, raison). Les codes d'un script qui ne sort que par une telle sortie déclarée portent
#     « rendu_par: transmission ». finish_train.sh (u5) suit cette forme. Une ligne qui commence par « exec » suivi d'une commande est aussi une sortie calculée :
#     le code de sortie est celui du processus lancé ;
#   - tout code qu'un script rend est déclaré ; tout code « utilise » est rendu par le script (ou porte rendu_par: transmission) ;
#   - un code « reserve » nomme le change OpenSpec ouvert et la tâche qui le réservent (le change doit exister hors de l'archive, la tâche
#     dans son tasks.md). Tant que le change est ouvert, le script peut déjà le rendre : le test l'accepte et l'écrit en information ; à
#     l'archivage du change, le test échoue : l'entrée passe à « utilise » (et perd change et tache), ou à « jamais_rendu » si le script ne le
#     rend pas, ou disparaît ;
#   - un script marqué « facultatif » peut être absent ; présent, ses codes doivent être déclarés (« utilise », « reserve » tant que son
#     change est ouvert, ou « jamais_rendu »). tools/finish_train.sh n'est plus facultatif depuis l'archive de finish-train-v1 (2026-11-01).
# Plage réservée : finish_train 60 à 84 (82 : finish-e2e-proof-shared, D11 ; 83 : finish-single-b3-b6, D19, livré ; 84 : autonomous-trains-merge, D19, tranche 1) ; 1 à 59 et 85 à 128 restent libres (les codes 1 à 20, 21 à 52 et 53
# des fins unitaires sont retirés par B9) ; 129, 130 et 143 sont des signaux que le train rend (SIGNAUX de tests/finish_codes/aide_registre.py) ; 141, PIPE, n'est déclaré que par
# finish_train : si un autre script le rend un jour, l'ajouter à PARTAGES, sinon il est refusé comme partage non permis. 78 est aussi
# le code des dossiers du lab de lab_paths.sh et morning_state.sh (hors de ce registre).
# Élargissement de la zone du train, de 60 à 79 à 60 à 81 (décision Q de l'auteur du 2026-10-27) : la plage 60 à 79 était pleine, et l'installation des
# paquets de Mothra dans le worktree d'intégration (décision A du 2026-10-27, design D10) a besoin de deux refus distincts : 80 (version de Node
# différente de mothra/.node-version) et 81 (échec de npm ci --offline).
#
# Champs d'une entrée de « codes » :
#   script   nom court du script (clé de « scripts »)
#   code     entier de 0 à 255
#   sens     sens court, une phrase
#   origine  utilise | reserve | jamais_rendu (réservé dans l'en-tête du script, jamais rendu ; accepté même pour un script absent)
#   change, tache   seulement pour « reserve » : change OpenSpec ouvert et numéro de tâche de son tasks.md
#   source   facultatif : où le sens est décrit (design, tâche) quand le script n'existe pas encore
#   rendu_par   facultatif, « utilise » seulement : transmission (le code n'est rendu que par une sortie calculée déclarée dans sorties_dynamiques)
#
# Quand un code réservé est livré (le script le rend et le change est archivé) : passer l'entrée à « utilise », retirer change et tache (et la
# tâche du tasks.md n'a plus de rôle) ; voir aussi docs/pmzilla/installation.md.
#
# « sorties_dynamiques » : les sorties calculées autorisées (script, motif : un morceau de la ligne, raison). Une entrée dont la ligne a disparu
# du script est refusée.
#
# Les sections « traductions », « transmis », « controle_rendus » et « continue_au_controle » (le passage des codes de la fin unitaire par
# l'enveloppe) sont retirées par B78 (finish-single-b7-b9, D7). Rien ne les remplace.

scripts:
  finish_train: {fichier: tools/finish_train.sh}

codes:
