  # Code 77 (désherbage D67 du 2026-10-28) : aucune cause d'origine écrite (en-tête de finish_train.sh, ligne 41) ; il garde la zone 60 à 81 sans trou,
  # que test_la_zone_60_a_81_du_train_est_declaree exige. Condition de retrait : passer à utilise si le script le rend, ou libérer avec le cadrage fin unique.
