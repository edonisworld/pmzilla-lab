# Sorties calculées autorisées (voir l'en-tête : forme imposée).
sorties_dynamiques:
  - {script: finish_train, motif: 'exit "$code"', raison: "la fonction refus() : le code est son premier argument, un littéral à chaque appel (extrait par le test)"}
