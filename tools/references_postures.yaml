# Ouvrages et documents que les règles et les références de chaque posture citent (socle partageable).
# `tools/outside_library.py` les compare au catalogue de la personne (`book_catalog.yaml`, ou la
# variable PMZILLA_LAB_CATALOGUE) et en tire la liste « hors bibliothèque » que wake.py imprime à chaque
# réveil : plus aucune liste écrite à la main dans les CREED, CAPABILITIES et références.
#
# titre     titre court tel que les règles le citent
# auteurs   noms de famille (au moins un doit figurer parmi les auteurs du catalogue)
# alias     autres titres sous lesquels le livre peut figurer au catalogue
# document  true : document officiel ou boîte à outils, pas un livre. Traité comme un livre (titre du catalogue) : hors
#           bibliothèque tant qu'aucune entrée du catalogue ne porte son titre ou un de ses alias, donc dès qu'il est indexé
# relations liens entre ouvrages que la posture ne doit pas confondre, imprimés par wake.py sous le bloc HORS BIBLIOTHÈQUE
#           (que l'ouvrage soit dans la bibliothèque ou non). Chaque lien : type (commente | ne_pas_confondre | supplee_par),
#           avec (titre de l'autre ouvrage), note (facultatif)

delivery:
  - {titre: Accelerate, auteurs: [Forsgren, Humble, Kim]}
  - {titre: The Principles of Product Development Flow, auteurs: [Reinertsen]}
  - {titre: Project to Product, auteurs: [Kersten]}
